name: Build

# Builds and tests both apps, checks Kotlin <-> Swift protocol interop, and on
# pushes publishes the APK and DMG as a GitHub release with stable download URLs.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Queue instead of cancelling so every pushed commit gets a full result.
  cancel-in-progress: false

jobs:
  core:
    name: Protocol core (Kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and protocol vectors
        run: android/android/gradlew -p android/core test --no-daemon
      - name: Python reference vectors still generate
        run: |
          pip install --quiet "cryptography>=42"
          python3 -I protocol/test-vectors/generate.py > /tmp/v1.json
          python3 - <<'EOF'
          import json
          a = json.load(open("protocol/test-vectors/v1.json")); b = json.load(open("/tmp/v1.json"))
          # Signatures are randomised; everything else must be identical.
          for d in (a, b):
              d["handshake"].pop("clientSignatureDerHex"); d["handshake"].pop("serverSignatureDerHex")
          assert a == b, "protocol/test-vectors/v1.json is out of date"
          print("vectors up to date")
          EOF

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    needs: core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install JS dependencies
        working-directory: android
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, unit tests
        working-directory: android
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci
      - name: Release keystore (only when secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CROSSDROP_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using the configured release key."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the public debug key (test builds only)."
          fi
      - name: Build release APK
        working-directory: android/android
        env:
          CROSSDROP_VERSION_CODE: ${{ github.run_number }}
          CROSSDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CROSSDROP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CROSSDROP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/android/app/build/outputs/apk/release/app-release.apk dist/CrossDrop.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-android
          path: dist/CrossDrop.apk
          if-no-files-found: error

  macos:
    name: macOS app, Swift tests, interop
    runs-on: macos-15
    needs: core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Swift unit tests and protocol vectors
        working-directory: macos
        run: swift test
      - name: Build interop CLIs
        run: |
          (cd macos && swift build -c release --product crossdrop-cli)
          android/android/gradlew -p android/core installDist --no-daemon
      - name: Kotlin <-> Swift interop over TCP
        run: |
          integration-tests/interop.sh \
            "$PWD/android/core/build/install/crossdrop-cli/bin/crossdrop-cli" \
            "$PWD/macos/.build/release/crossdrop-cli"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd macos && xcodegen generate
      - name: Build CrossDrop.app (universal, ad-hoc signed)
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -project CrossDrop.xcodeproj -scheme CrossDrop -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee xcodebuild.log | (grep -E "error:|warning:|\*\* BUILD" || true)
          APP=build/Build/Products/Release/CrossDrop.app
          lipo -info "$APP/Contents/MacOS/CrossDrop"
          codesign --verify --verbose "$APP"
      - name: Package DMG
        run: |
          brew install create-dmg
          python3 -m pip install --quiet --user pillow 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow
          mkdir -p dist
          scripts/build-dmg.sh macos/build/Build/Products/Release/CrossDrop.app dist/CrossDrop.dmg
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-macos
          path: dist/CrossDrop.dmg
          if-no-files-found: error

  release:
    name: Publish test build
    if: github.event_name != 'pull_request'
    needs: [android, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-build.${{ github.run_number }}
        run: |
          cd dist
          sha256sum CrossDrop.apk CrossDrop.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<EOF
          Automated **test build** of CrossDrop 0.1.0 from \`${GITHUB_SHA::7}\` (branch \`${GITHUB_REF_NAME}\`).

          | File | What it is |
          |---|---|
          | \`CrossDrop.apk\` | Android 10+ (arm64, armv7, x86_64). Signed with the **public debug key** unless a release key is configured — install for testing only. |
          | \`CrossDrop.dmg\` | macOS 13+ universal app, **ad-hoc signed, not notarized**. |
          | \`SHA256SUMS.txt\` | Checksums for both files. |

          **First launch on macOS:** open the DMG, drag CrossDrop to Applications, open it once (macOS will block it),
          then go to System Settings › Privacy & Security and choose **Open Anyway**. Allow "Local Network" when asked.

          **Status:** CI checks protocol test vectors on both implementations and Kotlin↔Swift transfers over TCP.
          It has not yet been tested end-to-end on a physical Android phone and Mac; see docs/testing-matrix.md.
          EOF
          gh release create "$TAG" CrossDrop.apk CrossDrop.dmg SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CrossDrop 0.1.0 · test build ${{ github.run_number }}" \
            --notes-file notes.md --latest
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/CrossDrop.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "DMG: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/CrossDrop.dmg" >> "$GITHUB_STEP_SUMMARY"
